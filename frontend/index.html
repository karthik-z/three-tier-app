<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Three-Tier App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; }

    header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: white; padding: 20px 40px;
      display: flex; align-items: center; gap: 16px;
    }
    header h1 { font-size: 1.6rem; }
    header span { font-size: 0.85rem; opacity: 0.8; }

    .badges { display: flex; gap: 8px; margin-left: auto; }
    .badge {
      padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold;
    }
    .badge.green  { background: #00c853; }
    .badge.blue   { background: #29b6f6; }
    .badge.orange { background: #ff9800; }

    main { max-width: 900px; margin: 40px auto; padding: 0 20px; }

    .card {
      background: white; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 28px; margin-bottom: 28px;
    }
    .card h2 { margin-bottom: 18px; font-size: 1.1rem; color: #1a73e8; }

    .form-row { display: flex; gap: 12px; }
    input {
      flex: 1; padding: 10px 14px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 0.95rem; outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #1a73e8; }

    button {
      padding: 10px 22px; border: none; border-radius: 8px;
      font-size: 0.95rem; cursor: pointer; font-weight: 600;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-add    { background: #1a73e8; color: white; }
    .btn-del    { background: #e53935; color: white; padding: 6px 14px; font-size: 0.8rem; }
    .btn-reload { background: #f1f3f4; color: #333; margin-left: 8px; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 14px; border-bottom: 2px solid #e8eaed;
         font-size: 0.8rem; text-transform: uppercase; color: #888; }
    td { padding: 12px 14px; border-bottom: 1px solid #f1f3f4; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8f9fa; }

    .empty { text-align: center; color: #aaa; padding: 32px; }
    .status { font-size: 0.85rem; padding: 6px 12px; border-radius: 6px; margin-top: 10px; display:none; }
    .status.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .status.error   { background: #ffebee; color: #c62828; display: block; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🚀 Three-Tier App</h1>
    <span>Kubernetes · Spring Boot · MySQL</span>
  </div>
  <div class="badges">
    <span class="badge green">Frontend ✓</span>
    <span class="badge blue">Backend ✓</span>
    <span class="badge orange">MySQL ✓</span>
  </div>
</header>

<main>
  <!-- Add User -->
  <div class="card">
    <h2>➕ Add New User</h2>
    <div class="form-row">
      <input id="name"  type="text"  placeholder="Full Name" />
      <input id="email" type="email" placeholder="Email Address" />
      <button class="btn-add" onclick="addUser()">Add User</button>
    </div>
    <div id="msg" class="status"></div>
  </div>

  <!-- User List -->
  <div class="card">
    <h2>
      👥 Users
      <button class="btn-reload" onclick="loadUsers()">🔄 Refresh</button>
    </h2>
    <table>
      <thead>
        <tr><th>#</th><th>Name</th><th>Email</th><th>Created</th><th>Action</th></tr>
      </thead>
      <tbody id="userTable">
        <tr><td colspan="5" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
  // Backend URL — update if needed
  const API = (window.BACKEND_URL || '') + '/api/users';

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'status ' + type;
    setTimeout(() => el.className = 'status', 3000);
  }

  async function loadUsers() {
    const tbody = document.getElementById('userTable');
    try {
      const res  = await fetch(API);
      const data = await res.json();
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No users yet. Add one above!</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${new Date(u.createdAt).toLocaleString()}</td>
          <td><button class="btn-del" onclick="deleteUser(${u.id})">Delete</button></td>
        </tr>`).join('');
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty" style="color:#e53935">⚠️ Cannot reach backend. Is it running?</td></tr>';
    }
  }

  async function addUser() {
    const name  = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    if (!name || !email) { showMsg('Please fill in both fields.', 'error'); return; }
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
      });
      if (!res.ok) throw new Error('Failed');
      document.getElementById('name').value  = '';
      document.getElementById('email').value = '';
      showMsg('✅ User added successfully!', 'success');
      loadUsers();
    } catch (e) {
      showMsg('❌ Error adding user. Check backend connection.', 'error');
    }
  }

  async function deleteUser(id) {
    if (!confirm('Delete this user?')) return;
    await fetch(`${API}/${id}`, { method: 'DELETE' });
    loadUsers();
  }

  loadUsers();
</script>
</body>
</html>
